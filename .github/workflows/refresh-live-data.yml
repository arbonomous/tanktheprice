name: Refresh Live HormuzFlow Data

on:
  schedule:
    # Auto-refresh every 6 hours with live yfinance oil prices + IMF PortWatch / Hormuz.now / AISStream
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Fetch live maritime & crude oil feeds and compute signals
        env:
          PYTHONPATH: .
          FEED_MODE: auto
          AISSTREAM_LISTEN_SECONDS: "60"
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          STRAITS_LIVE_API_KEY: ${{ secrets.STRAITS_LIVE_API_KEY }}
          DATALASTIC_API_KEY: ${{ secrets.DATALASTIC_API_KEY }}
          MARINETRAFFIC_API_KEY: ${{ secrets.MARINETRAFFIC_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python scripts/build_live_pages.py

      - name: Commit & push updated live snapshot to GitHub Pages
        run: |
          git config user.name "hormuzflow-bot"
          git config user.email "hormuzflow-bot@users.noreply.github.com"
          git add docs/data/live_snapshot.json
          if git diff --staged --quiet; then
            echo "No changes to live snapshot."
          else
            git commit -m "chore: refresh live HormuzFlow maritime & oil data"
            git push origin main
          fi
